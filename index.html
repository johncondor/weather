<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornwall, Vermont — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eee4; --fg:#2a251e; --muted:#7a7164; --rule:rgba(42,37,30,.16); --chip:rgba(42,37,30,.07);
  }
  [data-theme="dusk"]{ --bg:linear-gradient(170deg,#33445a 0%,#7b5a6e 60%,#c98a6b 100%); --fg:#f6ede4; --muted:#d3c3bd; --rule:rgba(246,237,228,.25); --chip:rgba(246,237,228,.12); }
  [data-theme="dawn"]{ --bg:linear-gradient(180deg,#13284f 0%,#3b6aa0 40%,#8db6d6 72%,#f0b866 100%); --fg:#fbf5ea; --muted:#dbe4ee; --rule:rgba(251,245,234,.3); --chip:rgba(251,245,234,.14); }
  [data-theme="dawn"] main{text-shadow:0 1px 3px rgba(10,22,45,.45)}
  [data-theme="sky"]{ --bg:linear-gradient(180deg,#bcd9ee 0%,#e8f2f8 100%); --fg:#1d2f3d; --muted:#53697a; --rule:rgba(29,47,61,.18); --chip:rgba(29,47,61,.08); }
  [data-theme="moss"]{ --bg:#dfe6d6; --fg:#25301f; --muted:#667259; --rule:rgba(37,48,31,.18); --chip:rgba(37,48,31,.08); }
  [data-theme="slate"]{ --bg:#2e3a41; --fg:#e8ece9; --muted:#a3b0b4; --rule:rgba(232,236,233,.2); --chip:rgba(232,236,233,.09); }
  [data-theme="night"]{ --bg:linear-gradient(180deg,#0b121b 0%,#17222f 100%); --fg:#e9e4d8; --muted:#97a0ab; --rule:rgba(233,228,216,.18); --chip:rgba(233,228,216,.08); }

  *{box-sizing:border-box}
  html{min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--fg);transition:color .4s}
  body{margin:0;min-height:100vh;font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
  main{max-width:640px;margin:0 auto;padding:44px 24px 96px}

  .agency{margin:0 0 16px;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:40px;line-height:.88;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
  .agency span{display:inline-block}
  .datehead{margin:16px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
  .condbox{flex:1;min-width:0;padding-left:6px}
  .dow{font-size:2.1rem;font-weight:400;line-height:1.1;letter-spacing:-.01em}
  .calrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:2px}
  .cal{font-size:1.1rem;font-style:italic;font-weight:300;color:var(--muted)}
  .calink{font-size:1.02rem;color:var(--fg);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;white-space:nowrap}
  .calink:hover{text-decoration-thickness:2px}
  .calink:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  .place{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
  .now{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
  .now img{width:148px;height:148px;margin:-14px -10px -14px -22px;flex:none}
  .temp{font-size:5.4rem;font-weight:300;line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums}
  .temp sup{font-size:.4em;font-weight:300;vertical-align:top;position:relative;top:.35em;margin-left:2px;color:var(--muted)}
  .cond{font-size:1.3rem;line-height:1.2;font-style:italic;font-weight:300;margin:0}
  .meta{color:var(--muted);font-size:.9rem;line-height:1.3;margin:4px 0 0}

  .lede{font-size:1.2rem;line-height:1.6;margin:26px 0 0;font-weight:400;text-wrap:pretty}
  .lede::first-letter{font-size:2.9em;float:left;line-height:.85;padding:.06em .08em 0 0;font-weight:300}

  .alert{margin:22px 0 0;padding:10px 14px;border-left:3px solid currentColor;background:var(--chip);font-size:.98rem;display:none}
  .alert b{font-weight:500}

  h2{font-size:.82rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:42px 0 0;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .day{display:grid;grid-template-columns:76px 52px 1fr auto;align-items:center;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--rule)}
  .day .n{font-size:1.05rem}
  .day img{width:52px;height:52px;margin:-4px 0}
  .day .s{font-size:.98rem;color:var(--muted);line-height:1.3}
  .day .t{font-variant-numeric:lining-nums tabular-nums;text-align:right;font-size:1.05rem;white-space:nowrap}
  .day .t i{color:var(--muted);font-style:normal;margin-left:8px}

  footer{margin-top:34px;padding-right:56px;font-size:.85rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge{border:1px solid var(--rule);border-radius:99px;padding:1px 10px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
  .badge.live{color:inherit}

  /* background picker */
  #pickBtn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--chip);color:var(--fg);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  #pickBtn:hover{background:var(--rule)}
  #pickBtn:focus-visible,.sw:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  #pop{position:fixed;right:18px;bottom:72px;width:min(280px,calc(100vw - 36px));padding:16px 16px 14px;border-radius:14px;background:#fbf8f2;color:#2a251e;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:6;display:none;font-size:.95rem}
  #pop.open{display:block;animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #pop p{margin:0 0 10px;font-style:italic;color:#6b6356}
  .sws{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sw{border:2px solid transparent;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:center}
  .sw span.c{display:block;height:46px;border-radius:9px;border:1px solid rgba(0,0,0,.15)}
  .sw span.l{display:block;font-size:.82rem;margin-top:4px}
  .sw[aria-pressed="true"] span.c{outline:2px solid #2a251e;outline-offset:2px}

  /* no-data state */
  .err{display:none;margin:34px 0 0;text-align:center;color:var(--muted)}
  .err svg{display:block;margin:0 auto 12px;color:var(--fg)}
  .err p{margin:0;font-size:1.25rem;font-style:italic}
  .err button{margin-top:16px;font:inherit;font-size:.95rem;color:var(--fg);background:var(--chip);border:1px solid var(--rule);border-radius:99px;padding:4px 18px;cursor:pointer}
  .err button:hover{background:var(--rule)}
  .err button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  main.nodata .now, main.nodata .lede, main.nodata .alert, main.nodata h2, main.nodata #days{display:none !important}
  main.nodata .err{display:block}

  @media (max-width:420px){ .temp{font-size:4.4rem} .now img{width:120px;height:120px} }
</style>
</head>
<body>
<main>
  <h1 class="agency" id="agency"><span>MEAS WEATHER SERVICE</span></h1>
  <p class="place" id="place">Cornwall, Vermont</p>
  <section class="now" aria-live="polite">
    <img id="nowIcon" alt="" src="">

  </header>

  <div class="err" id="err" role="status">

    <p>Sorry, your request didn't work.</p>
    <button type="button" id="retry">Try again</button>
  </div>

  <p class="lede" id="lede"></p>
  <div class="alert" id="alert" role="status"></div>

  <h2>The week ahead</h2>
  <div id="days"></div>

  <footer>
    <span class="badge" id="badge">loading</span>
    <span id="src">Forecast text: National Weather Service. Icons: Meteocons by Bas Milius (MIT).</span>
  </footer>
</main>

<button id="pickBtn" aria-label="Change background" aria-haspopup="true" aria-expanded="false" title="Background">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg>
</button>
<div id="pop" role="dialog" aria-label="Background">
  <p>Choose a background</p>
  <div class="sws" id="sws"></div>
</div>

/* Map NWS shortForecast text to a Meteocons icon. */
function iconFor(text, day){
  const t = (text||"").toLowerCase();
  const d = day ? "day" : "night";
  if (/thunder/.test(t)) return "thunderstorms-rain";
  if (/sleet|freezing|wintry|rain and snow|snow and rain/.test(t)) return "sleet";
  if (/snow|flurr|blizzard/.test(t)) return "snow";
  if (/drizzle/.test(t)) return "drizzle";
  if (/rain|shower/.test(t)) return "rain";
  if (/fog/.test(t)) return "fog";
  if (/haze|smoke/.test(t)) return "haze";
  if (/windy|breezy/.test(t) && !/cloud|sun|clear/.test(t)) return "wind";
  if (/overcast/.test(t)) return "overcast";
  if (/mostly cloudy|cloudy/.test(t) && !/partly/.test(t)) return "cloudy";
  if (/partly|mostly sunny|mostly clear|becoming (sunny|clear)/.test(t)) return "partly-cloudy-" + d;
  if (/sunny|clear/.test(t)) return "clear-" + d;
  return "cloudy";
}
const img = (k) => ICONS[k] || ICONS["cloudy"];

/* Live NWS: points -> forecast + hourly (+ alerts). Shows the no-data state on any failure. */
async function getJSON(u){
  const r = await fetch(u, { headers: { Accept: "application/geo+json" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadLive(){
  const pt = await getJSON(`https://api.weather.gov/points/${LOC.lat},${LOC.lon}`);
  const P = pt.properties;
  const [fc, hr, al] = await Promise.all([
    getJSON(P.forecast), getJSON(P.forecastHourly),
    getJSON(`https://api.weather.gov/alerts/active?point=${LOC.lat},${LOC.lon}`).catch(()=>null)
  ]);
  const per = fc.properties.periods;
  const h0 = hr.properties.periods[0];
  const rows = [];
  for (let i = 0; i < per.length && rows.length < 7; i++){
    const p = per[i];
    if (p.isDaytime){
      const nx = per[i+1];
      rows.push({ name: p.name, hi: p.temperature, lo: nx && !nx.isDaytime ? nx.temperature : null, short: p.shortForecast, day: true });
      if (nx && !nx.isDaytime) i++;
    } else {
      rows.push({ name: p.name, hi: null, lo: p.temperature, short: p.shortForecast, day: false });
    }
  }
  const a = al && al.features && al.features[0];
  return {
    place: P.relativeLocation ? `${P.relativeLocation.properties.city}, ${P.relativeLocation.properties.state}` : LOC.name,
    now: { temp: h0.temperature, short: h0.shortForecast, wind: `${h0.windDirection} ${h0.windSpeed}`, daytime: h0.isDaytime },
    lede: per[0].detailedForecast,
    alert: a ? { event: a.properties.event, headline: a.properties.headline } : null,
    periods: rows
  };
}

/* Escape text before it goes into innerHTML. */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function render(d){
  document.getElementById("place").textContent = d.place;
  document.getElementById("nowIcon").src = img(iconFor(d.now.short, d.now.daytime));
  document.getElementById("temp").innerHTML = `${esc(d.now.temp)}<sup>°F</sup>`;
  document.getElementById("cond").textContent = d.now.short;
  document.getElementById("meta").textContent = `Wind ${d.now.wind}`;
  document.getElementById("lede").textContent = d.lede;
  const al = document.getElementById("alert");
  if (d.alert){ al.style.display = "block"; al.innerHTML = `<b>${esc(d.alert.event)}.</b> ${esc(d.alert.headline)}`; }
  else al.style.display = "none";
  document.getElementById("days").innerHTML = d.periods.map(p => `
    <div class="day">
      <span class="n">${esc(p.name)}</span>
      <img alt="" src="${img(iconFor(p.short, p.day))}">
      <span class="s">${esc(p.short)}</span>
      <span class="t">${p.hi!=null ? esc(p.hi)+"°" : ""}${p.lo!=null ? `<i>${esc(p.lo)}°</i>` : ""}</span>
    </div>`).join("");
  const b = document.getElementById("badge");
  b.textContent = "live · NWS";
  b.className = "badge live";
}

/* Fit the top line to the full column width. */
function fitAgency(){
  const h = document.getElementById("agency"), s = h.firstElementChild;
  h.style.fontSize = "100px";
  const w = s.getBoundingClientRect().width;
  if (w > 0) h.style.fontSize = (100 * h.clientWidth / w) + "px";
}
fitAgency();
window.addEventListener("resize", fitAgency);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAgency);

/* Day of week and calendar date, refreshed each minute so it rolls over at midnight. */
function tickDate(){
  const n = new Date();
  document.getElementById("dow").textContent = n.toLocaleDateString("en-US", { weekday: "long" });
  document.getElementById("cal").textContent = n.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
tickDate(); setInterval(tickDate, 60000);

async function load(){
  const m = document.querySelector("main"), b = document.getElementById("badge");
  b.textContent = "loading"; b.className = "badge";
  try { render(await loadLive()); m.classList.remove("nodata"); }
  catch (e) { m.classList.add("nodata"); b.textContent = "no data"; }
}
load();
document.getElementById("retry").addEventListener("click", load);

/* Background picker */
const THEMES = [
  ["paper","Paper","#f3eee4"],
  ["sky","Sky","linear-gradient(180deg,#bcd9ee,#e8f2f8)"],
  ["moss","Moss","#dfe6d6"],
  ["dawn","Dawn","linear-gradient(180deg,#13284f,#3b6aa0 40%,#8db6d6 72%,#f0b866)"],
  ["dusk","Dusk","linear-gradient(170deg,#33445a,#7b5a6e 60%,#c98a6b)"],
  ["slate","Slate","#2e3a41"],
  ["night","Night","linear-gradient(180deg,#0b121b,#17222f)"]
];
const root = document.documentElement, pop = document.getElementById("pop"), btn = document.getElementById("pickBtn"), sws = document.getElementById("sws");
function setTheme(k, save){
  if (k === "paper") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", k);
  sws.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.k === k)));
  if (save){ try { localStorage.setItem("wx-theme", k); } catch(e){} }
}
sws.innerHTML = THEMES.map(([k,l,c]) => `<button class="sw" data-k="${k}" aria-pressed="false"><span class="c" style="background:${c}"></span><span class="l">${l}</span></button>`).join("");
sws.addEventListener("click", e => { const s = e.target.closest(".sw"); if (s) setTheme(s.dataset.k, true); });
function toggle(open){
  pop.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", String(open));
}
btn.addEventListener("click", e => { e.stopPropagation(); toggle(!pop.classList.contains("open")); });
document.addEventListener("click", e => { if (!pop.contains(e.target)) toggle(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") toggle(false); });
let saved = "dusk"; try { saved = localStorage.getItem("wx-theme") || "dusk"; } catch(e){}
setTheme(THEMES.some(t => t[0] === saved) ? saved : "dusk", false);
</script>
</body>
</html>
